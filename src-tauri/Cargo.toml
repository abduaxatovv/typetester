[package]
name = "typetester"
version = "0.1.0"
description = "TypeTester — a fast, offline-first typing test"
license = "MIT"
authors = ["TypeTester"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri builds: the desktop app, the Android/iOS shells
# and unit tests all link against this crate.
[lib]
name = "typetester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
